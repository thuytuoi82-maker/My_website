<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trực quan hóa 06 thuật toán sắp xếp</title>

<style>
:root{
  --bg:#eef3f8;
  --card:#ffffff;
  --text:#172033;
  --muted:#536173;
  --bd:#cbd5e1;
  --sky:#60a5fa;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;
  --navy:#1e3a8a;
  --trace:#fff4b8;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  font-family:"Times New Roman",Times,serif;
  background:var(--bg);
  color:var(--text);
}
.app{
  width:min(1900px,100%);
  height:100%;
  margin:0 auto;
  padding:8px 14px 10px;
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr);
  gap:8px;
}
.top-header{
  min-height:104px;
  display:grid;
  grid-template-columns:106px minmax(0,1fr);
  align-items:center;
  column-gap:12px;
}
.logo-box{
  grid-row:1 / span 2;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo-box img{
  width:96px;
  height:96px;
  object-fit:contain;
  display:block;
}
.title-area{min-width:0}
h1{
  text-align:center;
  font-size:clamp(30px,2.45vw,42px);
  line-height:1.05;
  margin:0;
  color:#c1121f;
  font-weight:700;
  letter-spacing:.2px;
}
.author-meta{
  width:100%;
  margin-left:0;
  padding-top:12px;
  font-size:20px;
  line-height:1.15;
  font-weight:700;
  white-space:nowrap;
  text-align:right;
  padding-right:8px;
}
.card{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:12px;
}
.controls{
  padding:10px 12px;
}
.grid{
  display:grid;
  grid-template-columns:1.12fr 1.42fr .72fr 1.08fr;
  gap:12px;
  align-items:end;
}
label{
  display:block;
  font-weight:700;
  font-size:26px;
  line-height:1.02;
  margin-bottom:4px;
}
input,select,button{
  font-family:"Times New Roman",Times,serif;
  font-size:24px;
  line-height:1;
}
input,select{
  width:100%;
  height:48px;
  border:1px solid var(--bd);
  border-radius:8px;
  padding:4px 9px;
  background:#fff;
}
.speed-wrap{
  display:block;
  width:100%;
}

input[type="range"]{
  height:38px;
  padding:0;
}
.actions{
  display:grid;
  grid-template-columns:1.55fr repeat(5,minmax(0,1fr));
  gap:10px;
  margin-top:8px;
  width:100%;
}
button{
  width:100%;
  height:46px;
  padding:3px 8px;
  border:1px solid transparent;
  border-radius:8px;
  font-size:22px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
  transition:filter .15s ease, transform .08s ease;
}
button:hover:not(:disabled){filter:brightness(.96)}
button:active:not(:disabled){transform:translateY(1px)}
#rnd{background:#2563eb;color:#fff}
#start{background:#16a34a;color:#fff}
#next{background:#d97706;color:#fff}
#auto{background:#7c3aed;color:#fff}
#stop{background:#dc2626;color:#fff}
#reset{background:#475569;color:#fff}
button:disabled{opacity:.42;cursor:not-allowed}
.work{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1.06fr) minmax(600px,.94fr);
  gap:8px;
}
.work>.card{
  min-height:0;
  overflow:hidden;
}
.visual-card{
  display:flex;
  flex-direction:column;
  padding:8px 10px 7px;
}
.code-card{
  display:flex;
  flex-direction:column;
  padding:8px 10px 8px;
}
.visual-head{
  display:flex;
  align-items:center;
  min-height:34px;
  margin-bottom:4px;
  white-space:nowrap;
}
.code-card h2{
  font-size:20px;
  line-height:1;
  margin:0;
  flex:0 0 auto;
}
.visual-info{
  min-width:0;
  width:100%;
  display:grid;
  grid-template-columns:minmax(150px,.75fr) minmax(0,3.25fr);
  align-items:center;
  gap:18px;
  flex:1 1 auto;
}
.status{
  min-width:0;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:21px;
  line-height:1;
  font-weight:700;
  color:#7c2d12;
  text-align:center;
  white-space:nowrap;
}
.legend{
  min-width:0;
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  align-items:center;
  gap:8px;
  font-size:20px;
  line-height:1;
  font-weight:700;
  color:var(--muted);
}
.legend span{white-space:nowrap;text-align:center}
.dot{
  display:inline-block;
  width:18px;
  height:18px;
  border-radius:3px;
  margin-right:4px;
  vertical-align:-3px;
  border:1px solid rgba(0,0,0,.12);
}
.canvasWrap{
  flex:1 1 auto;
  min-height:0;
  border-top:1px solid #e5e7eb;
  overflow:hidden;
}
.canvasWrap canvas{
  display:block;
  width:100%;
  height:100%;
}
.msg{
  flex:0 0 auto;
  min-height:32px;
  padding-top:3px;
  color:var(--muted);
  font-size:21px;
  line-height:1.05;
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:center;
}
.code-card h2{
  margin-bottom:5px;
}
.code{
  flex:1 1 auto;
  min-height:0;
  margin:0;
  background:#111827;
  color:#e5e7eb;
  border-radius:10px;
  overflow:auto;
  padding:5px 0;
  font-family:"Times New Roman",Times,serif;
  font-size:28px;
  line-height:1.18;
}
.line{
  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  padding:2px 9px;
  white-space:pre;
}
.line.on{
  background:var(--trace);
  color:#111827;
  font-weight:700;
}
.no{
  color:#a8b0bd;
  text-align:right;
  padding-right:9px;
}
.line.on .no{color:#4b5563}

@media(max-height:900px){
  .app{padding-top:5px;gap:6px}
  .top-header{min-height:78px;grid-template-columns:84px minmax(0,1fr)}
  .logo-box img{width:76px;height:76px}
  h1{font-size:32px}
  .author-meta{font-size:17px;text-align:right}
  label{font-size:22px}
  input,select{font-size:20px}
  button{font-size:18px}
  input,select,button{height:40px}
  .speed-note{font-size:18px}
  .status{font-size:18px}
  .legend{font-size:17px;gap:8px}
  .dot{width:15px;height:15px}
  .msg{font-size:18px;min-height:25px}
  .code{font-size:23px}
}
@media(max-width:1450px){
  .author-meta{width:100%;margin-left:0;font-size:18px;text-align:right}
  label{font-size:23px}
  input,select{font-size:21px}
  button{font-size:19px}
  .legend{font-size:17px;gap:7px}
  .status{font-size:18px}
  .work{grid-template-columns:minmax(0,1fr) minmax(520px,.92fr)}
  .code{font-size:24px}
}
</style>

</head>

            <span><i class="dot" style="background:var(--green)"></i>Đã sắp xếp</span>
            <span><i class="dot" style="background:var(--red)"></i>Hoán vị</span>
            <span><i class="dot" style="background:var(--yellow)"></i>Đang so sánh</span>
          </div>
        </div>
      </div>
      <div class="canvasWrap">
        <canvas id="canvas" aria-label="Biểu đồ cột trực quan hóa mảng"></canvas>
      </div>
      <div id="msg" class="msg">Nhập mảng hoặc tạo mảng ngẫu nhiên, sau đó chọn Bắt đầu.</div>
    </section>

    <section class="card code-card">
      <h2>Code Trace - Python</h2>
      <pre id="code" class="code"></pre>
    </section>
  </div>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id),alg=$('alg'),arrEl=$('arr'),count=$('count'),speed=$('speed'),canvas=$('canvas'),ctx=canvas.getContext('2d'),code=$('code'),msg=$('msg'),status=$('status'),nextBtn=$('next'),autoBtn=$('auto'),stopBtn=$('stop');
const CODE={
selection:["def selection_sort(a):","    n = len(a)","    for i in range(n - 1):","        min_idx = i","        for j in range(i + 1, n):","            if a[j] < a[min_idx]:","                min_idx = j","        if min_idx != i:","            a[i], a[min_idx] = a[min_idx], a[i]","    return a"],
insertion:["def insertion_sort(a):","    for i in range(1, len(a)):","        key = a[i]","        j = i - 1","        while j >= 0 and a[j] > key:","            a[j + 1] = a[j]","            j -= 1","        a[j + 1] = key","    return a"],
interchange:["def interchange_sort(a):","    n = len(a)","    for i in range(n - 1):","        for j in range(i + 1, n):","            if a[i] > a[j]:","                a[i], a[j] = a[j], a[i]","    return a"],
bubble:["def bubble_sort(a):","    n = len(a)","    for i in range(n - 1):","        swapped = False","        for j in range(n - 1 - i):","            if a[j] > a[j + 1]:","                a[j], a[j + 1] = a[j + 1], a[j]","                swapped = True","        if not swapped:","            break","    return a"],
quick:["def quick_sort(a, left, right):","    if left >= right:","        return","    pivot = a[(left + right) // 2]","    i, j = left, right","    while i <= j:","        while a[i] < pivot:","            i += 1","        while a[j] > pivot:","            j -= 1","        if i <= j:","            a[i], a[j] = a[j], a[i]","            i += 1; j -= 1","    quick_sort(a, left, j)","    quick_sort(a, i, right)"],
merge:["def merge_sort(a, left, right):","    if left >= right: return","    mid = (left + right) // 2","    merge_sort(a, left, mid)","    merge_sort(a, mid + 1, right)","    merge(a, left, mid, right)","","def merge(a, left, mid, right):","    L = a[left:mid + 1]","    R = a[mid + 1:right + 1]","    i = j = 0; k = left","    while i < len(L) and j < len(R):","        if L[i] <= R[j]:","            a[k] = L[i]; i += 1","        else:","            a[k] = R[j]; j += 1","        k += 1","    while i < len(L):","        a[k] = L[i]; i += 1; k += 1","    while j < len(R):","        a[k] = R[j]; j += 1; k += 1"]};
let steps=[],pos=-1,timer=null,running=false;
function parse(){const p=arrEl.value.split(',').map(x=>x.trim()).filter(Boolean);if(p.length<2||p.length>30)throw Error('Mảng cần từ 2 đến 30 phần tử.');const a=p.map(Number);if(a.some(x=>!Number.isFinite(x)))throw Error('Mảng chỉ được chứa số hợp lệ.');return a}
const S=(a,o={})=>({a:[...a],cur:[...(o.cur||[])],cmp:[...(o.cmp||[])],swap:[...(o.swap||[])],done:[...(o.done||[])],line:o.line??null,msg:o.msg||''});
function renderCode(line=null){code.innerHTML='';CODE[alg.value].forEach((t,i)=>{const d=document.createElement('div');d.className='line'+(line===i+1?' on':'');const n=document.createElement('span');n.className='no';n.textContent=i+1;const c=document.createElement('span');c.textContent=t||' ';d.append(n,c);code.append(d);if(line===i+1)d.scrollIntoView({block:'nearest'})})}
function drawCanvas(s){
  const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  canvas.width=Math.max(1,Math.round(rect.width*dpr));
  canvas.height=Math.max(1,Math.round(rect.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const W=rect.width,H=rect.height,pad={l:32,r:16,t:42,b:38};
  const plotW=W-pad.l-pad.r,plotH=H-pad.t-pad.b,n=s.a.length;

  ctx.clearRect(0,0,W,H);
  ctx.font='24px Times New Roman';
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  const min=Math.min(0,...s.a),max=Math.max(0,...s.a),range=Math.max(max-min,1);
  const y=v=>pad.t+(max-v)/range*plotH;
  const base=y(0),slot=plotW/n,gap=Math.min(9,slot*.18),bw=Math.max(5,slot-gap);

  const C=new Set(s.cur),P=new Set(s.cmp),X=new Set(s.swap),D=new Set(s.done);
  const css=getComputedStyle(document.documentElement);
  const colors={
    normal:css.getPropertyValue('--sky').trim(),
    done:css.getPropertyValue('--green').trim(),
    swap:css.getPropertyValue('--red').trim(),
    cmp:css.getPropertyValue('--yellow').trim(),
    current:css.getPropertyValue('--navy').trim(),
    text:css.getPropertyValue('--text').trim(),
    muted:css.getPropertyValue('--muted').trim()
  };

  ctx.strokeStyle='#dbe3ec';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(pad.l,base);
  ctx.lineTo(W-pad.r,base);
  ctx.stroke();

  s.a.forEach((v,i)=>{
    const x=pad.l+i*slot+gap/2;
    const yv=y(v),top=Math.min(yv,base),h=Math.max(3,Math.abs(base-yv));

    let fill=colors.normal;
    if(D.has(i)) fill=colors.done;
    if(P.has(i)) fill=colors.cmp;
    if(X.has(i)) fill=colors.swap;

    ctx.fillStyle=fill;
    ctx.fillRect(x,top,bw,h);

    if(C.has(i) && !P.has(i) && !X.has(i)){
      ctx.strokeStyle=colors.current;
      ctx.lineWidth=3;
      ctx.strokeRect(x+1.5,top+1.5,Math.max(0,bw-3),Math.max(0,h-3));
    }

    ctx.fillStyle=colors.text;
    ctx.font='bold 21px Times New Roman';
    ctx.fillText(String(v),x+bw/2,v>=0?top-15:top+h+15);

    ctx.fillStyle=colors.muted;
    ctx.font='18px Times New Roman';
    ctx.fillText(String(i),x+bw/2,H-15);
  });
}
function render(s){drawCanvas(s);renderCode(s.line);msg.textContent=s.msg;status.textContent=`Bước ${pos+1}/${steps.length}`;if(pos===steps.length-1){stop();status.textContent='Hoàn thành sắp xếp.';nextBtn.disabled=true;autoBtn.disabled=true}}
function selection(a){let O=[S(a,{line:1,msg:'Bắt đầu Selection Sort.'})],n=a.length,d=[];for(let i=0;i<n-1;i++){let m=i;O.push(S(a,{cur:[i],done:d,line:4,msg:`Chọn i=${i} làm vị trí nhỏ nhất tạm thời.`}));for(let j=i+1;j<n;j++){O.push(S(a,{cmp:[m,j],done:d,line:6,msg:`So sánh a[${j}]=${a[j]} với a[${m}]=${a[m]}.`}));if(a[j]<a[m]){m=j;O.push(S(a,{cur:[m],done:d,line:7,msg:`Cập nhật min_idx=${m}.`}))}}if(m!==i){[a[i],a[m]]=[a[m],a[i]];O.push(S(a,{swap:[i,m],done:d,line:9,msg:`Hoán vị vị trí ${i} và ${m}.`}))}d.push(i)}d.push(n-1);O.push(S(a,{done:d,line:10,msg:'Mảng đã được sắp xếp.'}));return O}
function insertion(a){let O=[S(a,{done:[0],line:1,msg:'Bắt đầu Insertion Sort.'})],n=a.length;for(let i=1;i<n;i++){let key=a[i],j=i-1;O.push(S(a,{cur:[i],done:[...Array(i).keys()],line:3,msg:`Lấy key=${key}.`}));while(j>=0&&a[j]>key){O.push(S(a,{cmp:[j,j+1],line:5,msg:`${a[j]} > ${key}, dịch sang phải.`}));a[j+1]=a[j];O.push(S(a,{cur:[j+1],line:6,msg:`Dịch phần tử sang vị trí ${j+1}.`}));j--}a[j+1]=key;O.push(S(a,{cur:[j+1],done:[...Array(i+1).keys()],line:8,msg:`Chèn key vào vị trí ${j+1}.`}))}O.push(S(a,{done:[...Array(n).keys()],line:9,msg:'Mảng đã được sắp xếp.'}));return O}
function interchange(a){let O=[S(a,{line:1,msg:'Bắt đầu Interchange Sort.'})],n=a.length,d=[];for(let i=0;i<n-1;i++){for(let j=i+1;j<n;j++){O.push(S(a,{cmp:[i,j],done:d,line:5,msg:`So sánh a[${i}]=${a[i]} và a[${j}]=${a[j]}.`}));if(a[i]>a[j]){[a[i],a[j]]=[a[j],a[i]];O.push(S(a,{swap:[i,j],done:d,line:6,msg:'Hoán vị hai phần tử.'}))}}d.push(i)}d.push(n-1);O.push(S(a,{done:d,line:7,msg:'Mảng đã được sắp xếp.'}));return O}
function bubble(a){let O=[S(a,{line:1,msg:'Bắt đầu Bubble Sort.'})],n=a.length,d=[];for(let i=0;i<n-1;i++){let sw=false;for(let j=0;j<n-1-i;j++){O.push(S(a,{cmp:[j,j+1],done:d,line:6,msg:`So sánh ${a[j]} và ${a[j+1]}.`}));if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];sw=true;O.push(S(a,{swap:[j,j+1],done:d,line:7,msg:'Hoán vị hai phần tử.'}))}}d.push(n-1-i);if(!sw)break}O.push(S(a,{done:[...Array(n).keys()],line:11,msg:'Mảng đã được sắp xếp.'}));return O}
function quick(a){let O=[S(a,{line:1,msg:'Bắt đầu Quick Sort.'})];function q(l,r){if(l>=r){O.push(S(a,{cur:l===r?[l]:[],line:2,msg:`Đoạn [${l},${r}] không cần chia tiếp.`}));return}let p=a[(l+r)>>1],i=l,j=r;O.push(S(a,{cur:[(l+r)>>1],line:4,msg:`Pivot=${p}, đoạn [${l},${r}].`}));while(i<=j){while(a[i]<p){O.push(S(a,{cmp:[i],line:7,msg:`a[${i}] < pivot, tăng i.`}));i++}while(a[j]>p){O.push(S(a,{cmp:[j],line:9,msg:`a[${j}] > pivot, giảm j.`}));j--}if(i<=j){O.push(S(a,{cmp:[i,j],line:11,msg:`So sánh/cân bằng hai phía tại i=${i}, j=${j}.`}));[a[i],a[j]]=[a[j],a[i]];O.push(S(a,{swap:[i,j],line:12,msg:'Đã hoán vị.'}));i++;j--}}if(l<j)q(l,j);if(i<r)q(i,r)}q(0,a.length-1);O.push(S(a,{done:[...Array(a.length).keys()],line:15,msg:'Mảng đã được sắp xếp.'}));return O}
function merge(a){let O=[S(a,{line:1,msg:'Bắt đầu Merge Sort.'})];function mg(l,m,r){let L=a.slice(l,m+1),R=a.slice(m+1,r+1),i=0,j=0,k=l;O.push(S(a,{cur:[...Array(r-l+1).keys()].map(x=>x+l),line:8,msg:`Trộn [${l},${m}] với [${m+1},${r}].`}));while(i<L.length&&j<R.length){O.push(S(a,{cmp:[l+i,m+1+j].filter(x=>x<=r),line:13,msg:`So sánh ${L[i]} và ${R[j]}.`}));if(L[i]<=R[j]){a[k]=L[i++];O.push(S(a,{cur:[k],line:14,msg:`Ghi vào a[${k}].`}))}else{a[k]=R[j++];O.push(S(a,{cur:[k],line:16,msg:`Ghi vào a[${k}].`}))}k++}while(i<L.length){a[k]=L[i++];O.push(S(a,{cur:[k],line:18,msg:`Chép phần tử còn lại vào a[${k}].`}));k++}while(j<R.length){a[k]=R[j++];O.push(S(a,{cur:[k],line:20,msg:`Chép phần tử còn lại vào a[${k}].`}));k++}O.push(S(a,{done:[...Array(r-l+1).keys()].map(x=>x+l),line:6,msg:`Đoạn [${l},${r}] đã được trộn.`}))}function ms(l,r){if(l>=r){O.push(S(a,{cur:[l],line:2,msg:`Đoạn [${l},${r}] có một phần tử.`}));return}let m=(l+r)>>1;O.push(S(a,{cur:[m],line:3,msg:`Chia đoạn [${l},${r}] tại mid=${m}.`}));ms(l,m);ms(m+1,r);mg(l,m,r)}ms(0,a.length-1);O.push(S(a,{done:[...Array(a.length).keys()],line:6,msg:'Mảng đã được sắp xếp.'}));return O}
function build(name,a){return ({selection,insertion,interchange,bubble,quick,merge}[name])([...a])}
function prepare(){stop();try{const a=parse();steps=build(alg.value,a);pos=0;nextBtn.disabled=false;autoBtn.disabled=false;render(steps[pos]);return true}catch(e){status.textContent=e.message;return false}}
function next(){if(!steps.length){if(!prepare())return}else if(pos<steps.length-1){pos++;render(steps[pos])}}
function auto(){if(!steps.length&&!prepare())return;if(pos>=steps.length-1)return;stop();running=true;autoBtn.disabled=true;nextBtn.disabled=true;stopBtn.disabled=false;const tick=()=>{if(!running)return;if(pos<steps.length-1){pos++;render(steps[pos]);timer=setTimeout(tick,Math.max(100,1600-Number(speed.value)))}else stop()};timer=setTimeout(tick,Math.max(100,1600-Number(speed.value)))}
function stop(){running=false;if(timer){clearTimeout(timer);timer=null}stopBtn.disabled=true;if(steps.length&&pos<steps.length-1){nextBtn.disabled=false;autoBtn.disabled=false}}
function reset(){stop();steps=[];pos=-1;nextBtn.disabled=true;autoBtn.disabled=true;try{render(S(parse()));status.textContent='Đã đặt lại.';msg.textContent='Chọn Bắt đầu để tạo các bước mô phỏng.'}catch(e){ctx.clearRect(0,0,canvas.width,canvas.height);status.textContent=e.message}renderCode()}
$('rnd').onclick=()=>{let n=Math.max(2,Math.min(30,parseInt(count.value)||10));count.value=n;arrEl.value=Array.from({length:n},()=>Math.floor(Math.random()*90)+10).join(',');reset()};$('start').onclick=()=>{
  if(prepare()){
    status.textContent='Đã khởi tạo.';
    msg.textContent='Chọn Bước tiếp hoặc Tự động để chạy mô phỏng.';
  }
};nextBtn.onclick=next;autoBtn.onclick=auto;stopBtn.onclick=stop;$('reset').onclick=reset;alg.onchange=reset;arrEl.onchange=reset;window.addEventListener('resize',()=>{if(steps.length&&pos>=0)drawCanvas(steps[pos]);else{try{drawCanvas(S(parse()))}catch{}}});renderCode();reset();
</script></body></html>
